################################################################################
# HEALINK SX1278 SPI configuration for Raspberry Pi 4 / QNX 8
#
# Based on the Raspberry Pi BCM2711 QNX BSP template.  Only the SPI device
# parameters are changed for the SX1278 radios:
#   - SPI mode 0 (CPOL=0, CPHA=0)
#   - 8-bit words
#   - MSB first
#   - 1 MHz bring-up clock
#   - no idle insertion / CS delay
#
# spi0/dev0 -> SX1278 #1 -> GPIO8 / physical pin 24 (CE0)
# spi0/dev1 -> SX1278 #2 -> GPIO7 / physical pin 26 (CE1)
################################################################################

[globals]

[bus]
busno=0
name=spi0
base=0xfe204000
irq=150
input_clock=500000000
bs=rpanic=48,tpanic=16
dma_attach_opts=num_cbs=256,range_min=0,range_max=14,typed_mem=sysram&below1G
dma_thld=4

[dev]
parent_busno=0
devno=0
name=dev0
clock_rate=1000000
cpha=0
cpol=0
bit_order=MSB
word_width=8
idle_insert=0
cs_delay=0

[dev]
parent_busno=0
devno=1
name=dev1
clock_rate=1000000
cpha=0
cpol=0
bit_order=MSB
word_width=8
idle_insert=0
cs_delay=0

[bus]
busno=3
name=spi3
base=0xfe204600
irq=151
input_clock=500000000

[dev]
parent_busno=3
devno=0
name=dev0
clock_rate=5000000
cpol=1
